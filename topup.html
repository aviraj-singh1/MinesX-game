<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Top Up Wallet</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Specific styles for Top Up Page */
    .topup-shell { max-width: 480px; margin: 0 auto; padding: 20px; }
    .back-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; cursor: pointer; color: rgba(255,255,255,0.7); font-weight: 700;}
    
    .current-bal-card {
      background: linear-gradient(135deg, #0a5aa8, #084b93);
      padding: 20px; border-radius: 16px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 30px;
    }
    .bal-label { font-size: 14px; opacity: 0.8; margin-bottom: 5px; }
    .bal-value { font-size: 32px; font-weight: 900; color: #fff; }

    .amount-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; }
    .amt-btn {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
      padding: 15px; border-radius: 12px; color: white; font-size: 18px; font-weight: 800;
      cursor: pointer; transition: 0.2s;
    }
    .amt-btn:hover { background: rgba(255,255,255,0.15); }
    .amt-btn.selected {
      background: #ffd45d; color: #2a1a00; border-color: #ffd45d;
      box-shadow: 0 0 15px rgba(255, 212, 93, 0.4);
    }

    .pay-btn {
      width: 100%; padding: 18px; border-radius: 99px; border: none;
      background: linear-gradient(180deg, #4caf50, #388e3c);
      color: white; font-size: 18px; font-weight: 900; cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }

    /* FAKE PAYMENT MODAL */
    .pay-overlay {
      position: fixed; inset: 0; background: #1a1a1a; z-index: 2000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .upi-header { margin-bottom: 40px; text-align: center; }
    .upi-logo-row { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }
    .upi-icon { width: 40px; height: 40px; border-radius: 8px; background: white; padding: 5px; }
    
    .pin-display {
      display: flex; gap: 15px; margin-bottom: 40px;
    }
    .pin-dot {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3); transition: 0.2s;
    }
    .pin-dot.filled { background: white; border-color: white; }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; max-width: 320px; }
    .key {
      padding: 15px; font-size: 24px; font-weight: 600; color: white;
      background: transparent; border: none; cursor: pointer; border-radius: 50%;
    }
    .key:active { background: rgba(255,255,255,0.1); }
    
    .loader-spinner {
      border: 4px solid rgba(255,255,255,0.1); border-left-color: #4caf50;
      border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="app">
    <div class="topup-shell">
      <div class="back-nav" onclick="window.location.href='index.html'">
        <span>❮ Back to Game</span>
      </div>

      <div class="current-bal-card">
        <div class="bal-label">Current Balance</div>
        <div class="bal-value" id="displayBal">₹0</div>
      </div>

      <h3 style="opacity: 0.9; margin-bottom: 15px;">Select Amount</h3>
      <div class="amount-grid">
        <button class="amt-btn" data-amt="100">₹100</button>
        <button class="amt-btn" data-amt="500">₹500</button>
        <button class="amt-btn" data-amt="1000">₹1,000</button>
        <button class="amt-btn" data-amt="2000">₹2,000</button>
        <button class="amt-btn" data-amt="5000">₹5,000</button>
        <button class="amt-btn" data-amt="10000">₹10,000</button>
      </div>

      <button id="payNowBtn" class="pay-btn" disabled>PROCEED TO PAY</button>
    </div>
  </div>

  <div id="paymentModal" class="pay-overlay hidden">
    <div id="paymentStep1" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="upi-header">
        <h2 style="margin: 0;">Enter UPI PIN</h2>
        <p style="opacity: 0.7; font-size: 14px; margin-top: 5px;">Paying <span id="payAmountDisplay" style="color: #4caf50; font-weight: bold;"></span></p>
        <p style="font-size: 12px; color: #ffd45d; margin-top: 10px;">Hint: PIN is 0000</p>
      </div>

      <div class="pin-display">
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
        <div class="pin-dot" id="d4"></div>
      </div>

      <div class="keypad">
        <button class="key" onclick="pressKey(1)">1</button>
        <button class="key" onclick="pressKey(2)">2</button>
        <button class="key" onclick="pressKey(3)">3</button>
        <button class="key" onclick="pressKey(4)">4</button>
        <button class="key" onclick="pressKey(5)">5</button>
        <button class="key" onclick="pressKey(6)">6</button>
        <button class="key" onclick="pressKey(7)">7</button>
        <button class="key" onclick="pressKey(8)">8</button>
        <button class="key" onclick="pressKey(9)">9</button>
        <button class="key" onclick="pressKey('back')">⌫</button>
        <button class="key" onclick="pressKey(0)">0</button>
        <button class="key" onclick="submitPin()">✓</button>
      </div>
    </div>

    <div id="paymentStep2" class="hidden" style="text-align: center;">
      <div class="loader-spinner" id="spinner"></div>
      <div id="successCheck" class="hidden" style="font-size: 60px; color: #4caf50; margin-bottom: 20px;">✓</div>
      <h2 id="payStatusText">Verifying Payment...</h2>
      <p style="opacity: 0.6;">Please do not close this window.</p>
    </div>
  </div>

  <script src="topup.js"></script>
</body>
</html>
